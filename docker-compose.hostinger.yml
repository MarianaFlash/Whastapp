# Para el "Docker Manager" de hPanel (Hostinger) o cualquier servidor con Docker.
# Usa la imagen ya construida, no hay que compilar nada.
#
# Variables que debes definir (en el panel lateral de variables del Docker Manager,
# o las envía solas el script scripts/deploy-hostinger.mjs):
#   DASHBOARD_PASSWORD  contraseña larga para entrar al dashboard (obligatoria)
#   PUBLIC_URL          http://IP_DEL_SERVIDOR:3000  (o tu dominio con https)
#   TZ                  zona horaria, por defecto America/Bogota

services:
  pendientes:
    image: ghcr.io/marianaflash/whastapp:latest
    container_name: pendientes
    restart: unless-stopped
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Define DASHBOARD_PASSWORD en las variables del proyecto}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TZ: ${TZ:-America/Bogota}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - pendientes_data:/data
    ports:
      - "${HOST_PORT:-3000}:3000"

volumes:
  pendientes_data:
