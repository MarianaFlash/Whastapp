<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendientes · Entrar</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login">
    <form class="panel card" id="form">
      <h1>💬 Pendientes</h1>
      <p>Tu cola de WhatsApp sin responder.</p>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      </div>
      <div class="error" id="error"></div>
      <button class="btn primary" type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('form');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        if (res.ok) { location.href = '/'; return; }
        const data = await res.json().catch(() => ({}));
        error.textContent = data.error || 'No se pudo entrar';
      } catch {
        error.textContent = 'No hay conexión con el servidor';
      }
    });
  </script>
</body>
</html>
